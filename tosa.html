<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Tosa e Banho | Patas &amp; Cia</title>
    <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Banho &amp; Tosa</h1>
        <p style="margin:14px 0 24px;font-size:1.2rem">Escolha o porte do seu pet e veja o valor na hora.</p>
        <div class="row" id="sz"></div>
        <div class="grid" id="sv" style="margin-top:30px"></div>
        <section>
            <h2>Formas de pagamento</h2>
            <div class="grid" id="fp"></div>
        </section>
        <p style="margin-top:34px"><a class="btn y" href="contato.html">Agendar horário</a></p>
    </main>
    <script src="app.js"></script>
    <script>
        const nm = { P: 'Pequeno (até 10 kg)', M: 'Médio (10 a 25 kg)', G: 'Grande (acima de 25 kg)' }; let cur = 0;
        function draw() {
            sz.innerHTML = M.map((m, i) => `<button class="btn ${i == cur ? 'm' : ''}" onclick="cur=${i};draw()">${nm[m[0]]}</button>`).join('');
            sv.innerHTML = S.map(s => `<div class="card hv"><span class="big">${s[1]}</span><h3>${s[0]}</h3><p>${s[2]}</p><p>Duração: ${s[3]}</p><p class="price">${f(s[4] * M[cur][1])}</p></div>`).join('')
        }
        draw();
        fp.innerHTML = [['📱', 'Pix', '5% de desconto'], ['💳', 'Crédito', 'Até 3x sem juros'], ['🏧', 'Débito', 'Na hora, sem taxa'], ['💵', 'Dinheiro', 'Pague na retirada']].map(p => `<div class="card hv"><span class="big">${p[0]}</span><h3>${p[1]}</h3><p>${p[2]}</p></div>`).join('');
    </script>
</body>

</html>
